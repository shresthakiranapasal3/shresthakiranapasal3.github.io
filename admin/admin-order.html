<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Orders – Shrestha Kirana Pasal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 15px;
    }
    .order {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
    }
    .items {
      margin-left: 10px;
      font-size: 14px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      background: #2b7a3d;
      color: white;
    }
  </style>
</head>
<body>

<h2>📦 Orders Dashboard</h2>

<div id="orders"></div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<!-- Your Firebase Config -->
<script src="firebase.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("orders")
  .orderBy("createdAt", "desc")
  .onSnapshot(snapshot => {

    const box = document.getElementById("orders");
    box.innerHTML = "";

    snapshot.forEach(doc => {
      const o = doc.data();
      const date = o.createdAt
        ? o.createdAt.toDate().toLocaleString()
        : "";

      let itemsHtml = "";
      o.items.forEach(i => {
        itemsHtml += `<div>• ${i.name_en} × ${i.qty}</div>`;
      });

      box.innerHTML += `
        <div class="order">
          <span class="badge">${o.method}</span>
          <p><b>Total:</b> Rs ${o.total}</p>
          <p><b>Note:</b> ${o.note || "-"}</p>
          <p><b>Time:</b> ${date}</p>
          <div class="items">${itemsHtml}</div>
        </div>
      `;
    });

  });
</script>

</body>
</html>
