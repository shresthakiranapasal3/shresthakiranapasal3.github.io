<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shrestha Kirana Pasal</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="top">
  <div class="left">
    <img src="logo.png" class="logo" />
    <div>
      <h1>Shrestha Kirana Pasal</h1>
      <p class="slogan">Fresh • Local • Trusted by Letang</p>
      <p class="location">📍 B.P Chowk, Letang, Morang</p>
    </div>
  </div>

  <div class="right">
    <button class="langBtn">नेपाली / English</button>
    <button class="cartBtn" onclick="toggleCart()">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ================= category BAR ================= -->
<div id="categories" class="category-bar"></div>
<div id="subcategories" class="category-bar"></div>
<div id="types" class="category-bar"></div>

<!-- ================= PRODUCTS ================= -->
<section id="products" class="product-grid"></section>

<!-- ================= SIDE CART ================= -->
<div id="sideCart" class="side-cart">

  <div class="cartHeader">
    <h3>🛒 Your Order</h3>
    <button class="cart-close" onclick="toggleCart()">✖</button>
  </div>

  <div id="sideCartItems"></div>

  <div class="total">
    Total: Rs <span id="sideCartTotal">0</span>
  </div>

  <textarea
    id="noteBox"
    placeholder="Any note for shop? / केही भन्नु छ?"
  ></textarea>

  <button class="wa" onclick="orderWhatsApp()">📲 WhatsApp Order</button>
  <button class="ms" onclick="orderMessenger()">💬 Messenger</button>
  <button class="call" onclick="orderCall()">📞 Call</button>
</div>

<!-- ================= CONTACT BAR ================= -->
<div class="contactBar">
  <a href="https://wa.me/9779767156270" target="_blank">WhatsApp</a>
  <a href="tel:+9779767156270">Call</a>
  <a href="https://www.facebook.com/share/1HkJRVmhj1/" target="_blank">Facebook</a>
  <a href="https://www.tiktok.com/@shrestha.kirana.p3" target="_blank">TikTok</a>
</div>

<!-- ================= FIREBASE SDK (v8 – matches your setup) ================= -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>

  if ("serviceWorker" in navigator) {

  }
</script>-->

</body>
</html>
