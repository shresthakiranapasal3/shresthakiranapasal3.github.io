<!DOCTYPE html>
<html>
<head>
<title>Shrestha Kirana Pasal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#2e7d32;color:#fff;padding:12px;text-align:center}
input,select{padding:8px;width:100%;margin:5px 0}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:8px;text-align:center}
.card img{width:100%;height:120px;object-fit:cover}
button{background:#2e7d32;color:white;border:none;padding:8px;border-radius:5px;margin-top:5px}
.cart{background:#fff;margin:10px;padding:10px;border-radius:8px}
</style>
</head>

<body>

<header>
<h2>Shrestha Kirana Pasal</h2>
<p>B.P Chowk, Letang | 📞 9767156207</p>
</header>

<div style="padding:10px">
<input type="text" id="search" placeholder="Search products...">
<select id="category">
<option value="all">All Categories</option>
<option value="Grocery">Grocery</option>
<option value="Eggs">Eggs & Meat</option>
<option value="Bakery">Bakery & Dairy</option>
<option value="Icecream">Ice-cream</option>
</select>
</div>

<div class="products" id="products"></div>

<div class="cart">
<h3>Your Order</h3>
<ul id="cart"></ul>
<button onclick="order()">Order on WhatsApp</button>
</div>

<script>
let cart=[];
const products=[
{n:"Rice",np:"चामल",c:"Grocery",p:80,img:"rice.jpg"},
{n:"Sugar",np:"चिनी",c:"Grocery",p:120,img:"sugar.jpg"},
{n:"Eggs",np:"अण्डा",c:"Eggs",p:15,img:"eggs.jpg"},
{n:"Milk",np:"दूध",c:"Bakery",p:80,img:"milk.jpg"},
{n:"Ice Cream",np:"आइसक्रिम",c:"Icecream",p:60,img:"ice.jpg"}
];

function load(){
let html="";
let s=document.getElementById("search").value.toLowerCase();
let cat=document.getElementById("category").value;
products.forEach((p,i)=>{
if((cat=="all"||p.c==cat) && p.n.toLowerCase().includes(s)){
html+=`
<div class="card">
<img src="${p.img}">
<h4>${p.n} / ${p.np}</h4>
<select id="q${i}">
<option value="0.5">0.5 kg</option>
<option value="1">1 kg</option>
<option value="2">2 kg</option>
</select>
<p>Rs ${p.p}</p>
<button onclick="add(${i})">Add</button>
</div>`;
}});
document.getElementById("products").innerHTML=html;
}
function add(i){
let q=document.getElementById("q"+i).value;
cart.push(products[i].n+" - "+q+" kg");
document.getElementById("cart").innerHTML+=`<li>${products[i].n} - ${q} kg</li>`;
}
function order(){
let msg="Hello Shrestha Kirana Pasal,%0AI want to order:%0A";
cart.forEach(i=>msg+=i+"%0A");
window.open("https://wa.me/9779767156207?text="+msg);
}
document.getElementById("search").onkeyup=load;
document.getElementById("category").onchange=load;
load();
</script>

</body>
</html>
